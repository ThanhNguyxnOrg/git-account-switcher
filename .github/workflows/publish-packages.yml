name: Publish Package Manager Metadata

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-package-managers:
    name: Sync Homebrew and Scoop manifests
    if: startsWith(github.event.release.tag_name, 'v') && github.event.release.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint repository-scoped ThanhNguyxnAgent token
        id: app-token
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@2b5c5cad571ee93fd091e16e1734ebd819191e68
        with:
          profile: content
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "git-account-switcher"
          permission-contents: write

      - name: Download published package manifests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern 'gswitch.rb' --pattern 'gswitch.json' --dir dist --clobber
          test -s dist/gswitch.rb
          test -s dist/gswitch.json

      - name: Sync package manager repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          update_file() {
            path="$1"
            src="$2"
            msg="$3"
            content="$(base64 -w0 "$src")"
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
                -f message="$msg" -f content="$content" -f sha="$sha" -f branch=master >/dev/null
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
                -f message="$msg" -f content="$content" -f branch=master >/dev/null
            fi
          }
          update_file Formula/gswitch.rb dist/gswitch.rb "chore: gswitch v$version"
          update_file bucket/gswitch.json dist/gswitch.json "chore: gswitch v$version"
