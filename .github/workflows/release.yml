name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create ThanhNguyxnAgent token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "git-account-switcher"
          permission-contents: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify tag matches script version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bash_ver="$(sed -n 's/^SCRIPT_VERSION="\(.*\)"/\1/p' bin/git-account-switcher | head -n1)"
          ps_ver="$(sed -n 's/^\$SCRIPT_VERSION = "\(.*\)"/\1/p' bin/git-account-switcher.ps1 | head -n1)"
          test -n "$tag" && test "$tag" = "$bash_ver" && test "$tag" = "$ps_ver"
          echo "Releasing v$tag"

      - name: Stage release assets and packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="gswitch-v$version"
          mkdir -p dist "dist/$stage/bin" "dist/$stage/config"
          cp install.sh install.ps1 update.sh update.ps1 uninstall.sh uninstall.ps1 dist/
          cp bin/git-account-switcher bin/git-account-switcher.ps1 \
             bin/git-account-switcher.cmd bin/gswitch bin/gswitch.cmd \
             bin/switch-git bin/switch-git.cmd bin/switch-git.ps1 \
             "dist/$stage/bin/"
          cp config/accounts.example.json "dist/$stage/config/"
          cp README.md AGENT.md LICENSE "dist/$stage/"
          cp install.sh install.ps1 update.sh update.ps1 uninstall.sh uninstall.ps1 \
             "dist/$stage/"
          tar -czf "dist/$stage.tar.gz" -C dist "$stage"
          python3 - "$stage" <<'PY'
          import shutil, sys
          shutil.make_archive(f"dist/{sys.argv[1]}", "zip", root_dir="dist", base_dir=sys.argv[1])
          PY
          rm -rf "dist/$stage"
          tar_sha="$(sha256sum "dist/$stage.tar.gz" | awk '{print $1}')"
          zip_sha="$(sha256sum "dist/$stage.zip" | awk '{print $1}')"
          cat > dist/gswitch.rb <<EOF
          class Gswitch < Formula
            desc "Fast multi-account GitHub and Git identity switcher"
            homepage "https://github.com/ThanhNguyxnOrg/git-account-switcher"
            url "https://github.com/ThanhNguyxnOrg/git-account-switcher/releases/download/${GITHUB_REF_NAME}/${stage}.tar.gz"
            sha256 "${tar_sha}"
            license "MIT"
            def install
              bin.install "bin/git-account-switcher", "bin/gswitch", "bin/switch-git"
            end
          end
          EOF
          cat > dist/gswitch.json <<EOF
          {
            "version": "${version}",
            "description": "Fast multi-account GitHub and Git identity switcher",
            "homepage": "https://github.com/ThanhNguyxnOrg/git-account-switcher",
            "license": "MIT",
            "url": "https://github.com/ThanhNguyxnOrg/git-account-switcher/releases/download/${GITHUB_REF_NAME}/${stage}.zip",
            "hash": "${zip_sha}",
            "extract_dir": "${stage}",
            "bin": [
              ["bin\\\\gswitch.cmd", "gswitch"],
              ["bin\\\\git-account-switcher.cmd", "git-account-switcher"],
              ["bin\\\\switch-git.cmd", "switch-git"]
            ],
            "checkver": {
              "github": "https://github.com/ThanhNguyxnOrg/git-account-switcher"
            },
            "autoupdate": {
              "url": "https://github.com/ThanhNguyxnOrg/git-account-switcher/releases/download/v\$version/gswitch-v\$version.zip"
            }
          }
          EOF
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS >/dev/null)
          test "$(find dist -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)" -eq "$(wc -l < dist/SHA256SUMS)"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: "dist/*"

      - name: Publish GitHub release as ThanhNguyxnAgent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      - name: Sync package manager repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          update_file() {
            path="$1"
            src="$2"
            msg="$3"
            content="$(base64 -w0 "$src")"
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
                -f message="$msg" -f content="$content" -f sha="$sha" -f branch=master >/dev/null
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
                -f message="$msg" -f content="$content" -f branch=master >/dev/null
            fi
          }
          update_file Formula/gswitch.rb dist/gswitch.rb "chore: gswitch v$version"
          update_file bucket/gswitch.json dist/gswitch.json "chore: gswitch v$version"

  chocolatey:
    name: Chocolatey
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Pack, smoke-test, and publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ github.ref_name }}".TrimStart('v')
          $zipName = "gswitch-v$version.zip"
          $root = Join-Path $env:RUNNER_TEMP "gswitch-choco"
          $pkg = Join-Path $root "package"
          New-Item -ItemType Directory -Path (Join-Path $pkg "tools") -Force | Out-Null
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern $zipName --dir $root --clobber
          gh attestation verify (Join-Path $root $zipName) --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --deny-self-hosted-runners
          $hash = (Get-FileHash (Join-Path $root $zipName) -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$zipName"
          $nuspec = @'
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>gswitch</id>
              <version>__VERSION__</version>
              <title>git-account-switcher</title>
              <authors>ThanhNguyxn</authors>
              <owners>ThanhNguyxn</owners>
              <projectUrl>https://github.com/ThanhNguyxnOrg/git-account-switcher</projectUrl>
              <licenseUrl>https://github.com/ThanhNguyxnOrg/git-account-switcher/blob/master/LICENSE</licenseUrl>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <description>Fast multi-account GitHub and Git identity switcher.</description>
              <tags>git github account switch</tags>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          '@
          $nuspec = $nuspec.Replace('__VERSION__', $version)
          Set-Content -Path (Join-Path $pkg 'gswitch.nuspec') -Value $nuspec -Encoding UTF8
          $install = @'
          $ErrorActionPreference = 'Stop'
          $toolsDir = Split-Path -Parent $MyInvocation.MyCommand.Definition
          Install-ChocolateyZipPackage -PackageName 'gswitch' -Url64bit '__URL__' -Checksum64 '__HASH__' -ChecksumType64 'sha256' -UnzipLocation $toolsDir
          $binDir = Join-Path $toolsDir 'gswitch-v__VERSION__\bin'
          Install-BinFile -Name 'gswitch' -Path (Join-Path $binDir 'gswitch.cmd')
          Install-BinFile -Name 'git-account-switcher' -Path (Join-Path $binDir 'git-account-switcher.cmd')
          Install-BinFile -Name 'switch-git' -Path (Join-Path $binDir 'switch-git.cmd')
          '@
          $install = $install.Replace('__URL__', $url).Replace('__HASH__', $hash).Replace('__VERSION__', $version)
          Set-Content -Path (Join-Path $pkg 'tools\chocolateyInstall.ps1') -Value $install -Encoding UTF8
          $uninstall = @'
          $ErrorActionPreference = 'Stop'
          Uninstall-BinFile -Name 'gswitch'
          Uninstall-BinFile -Name 'git-account-switcher'
          Uninstall-BinFile -Name 'switch-git'
          '@
          Set-Content -Path (Join-Path $pkg 'tools\chocolateyUninstall.ps1') -Value $uninstall -Encoding UTF8
          Push-Location $pkg
          choco pack gswitch.nuspec --output-directory $root
          Pop-Location
          choco install gswitch --version $version --source $root -y --no-progress
          $shim = Join-Path $env:ChocolateyInstall 'bin\gswitch.exe'
          if (-not (Test-Path $shim)) { throw "Chocolatey shim not found: $shim" }
          $out = & $shim version
          if ($out -notmatch [regex]::Escape("v$version")) { throw "smoke test failed: $out" }
          choco uninstall gswitch -y --no-progress
          if (-not $env:CHOCO_API_KEY) { throw "CHOCO_API_KEY is not set" }
          choco push (Join-Path $root "gswitch.$version.nupkg") --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
