name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create ThanhNguyxnAgent token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "git-account-switcher,homebrew-tap"
          permission-contents: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify tag matches script version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bash_ver="$(sed -n 's/^SCRIPT_VERSION="\(.*\)"/\1/p' bin/git-account-switcher | head -n1)"
          ps_ver="$(sed -n 's/^\$SCRIPT_VERSION = "\(.*\)"/\1/p' bin/git-account-switcher.ps1 | head -n1)"
          test -n "$tag" && test "$tag" = "$bash_ver" && test "$tag" = "$ps_ver"
          echo "Releasing v$tag"

      - name: Stage release assets and packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="gswitch-v$version"
          mkdir -p dist "dist/$stage/bin" "dist/$stage/config"
          cp install.sh install.ps1 update.sh update.ps1 uninstall.sh uninstall.ps1 dist/
          cp bin/git-account-switcher bin/git-account-switcher.ps1 \
             bin/git-account-switcher.cmd bin/gswitch bin/gswitch.cmd \
             bin/switch-git bin/switch-git.cmd bin/switch-git.ps1 \
             "dist/$stage/bin/"
          cp config/accounts.example.json "dist/$stage/config/"
          cp README.md AGENT.md LICENSE "dist/$stage/"
          cp install.sh install.ps1 update.sh update.ps1 uninstall.sh uninstall.ps1 \
             "dist/$stage/"
          tar -czf "dist/$stage.tar.gz" -C dist "$stage"
          python3 - "$stage" <<'PY'
          import shutil, sys
          shutil.make_archive(f"dist/{sys.argv[1]}", "zip", root_dir="dist", base_dir=sys.argv[1])
          PY
          rm -rf "dist/$stage"
          tar_sha="$(sha256sum "dist/$stage.tar.gz" | awk '{print $1}')"
          zip_sha="$(sha256sum "dist/$stage.zip" | awk '{print $1}')"
          cat > dist/gswitch.rb <<EOF
          class Gswitch < Formula
            desc "Fast multi-account GitHub and Git identity switcher"
            homepage "https://github.com/ThanhNguyxnOrg/git-account-switcher"
            url "https://github.com/ThanhNguyxnOrg/git-account-switcher/releases/download/${GITHUB_REF_NAME}/${stage}.tar.gz"
            sha256 "${tar_sha}"
            license "MIT"
            def install
              bin.install "bin/git-account-switcher", "bin/gswitch", "bin/switch-git"
            end
          end
          EOF
          cat > dist/gswitch.json <<EOF
          {
            "version": "${version}",
            "description": "Fast multi-account GitHub and Git identity switcher",
            "homepage": "https://github.com/ThanhNguyxnOrg/git-account-switcher",
            "license": "MIT",
            "url": "https://github.com/ThanhNguyxnOrg/git-account-switcher/releases/download/${GITHUB_REF_NAME}/${stage}.zip",
            "hash": "${zip_sha}",
            "extract_dir": "${stage}",
            "bin": [
              ["bin\\\\gswitch.cmd", "gswitch"],
              ["bin\\\\git-account-switcher.cmd", "git-account-switcher"],
              ["bin\\\\switch-git.cmd", "switch-git"]
            ],
            "checkver": {
              "github": "https://github.com/ThanhNguyxnOrg/git-account-switcher"
            },
            "autoupdate": {
              "url": "https://github.com/ThanhNguyxnOrg/git-account-switcher/releases/download/v\$version/gswitch-v\$version.zip"
            }
          }
          EOF
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS >/dev/null)
          test "$(find dist -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)" -eq "$(wc -l < dist/SHA256SUMS)"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: "dist/*"

      - name: Publish GitHub release as ThanhNguyxnAgent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      - name: Sync package manager repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          update_file() {
            repo="$1"
            path="$2"
            src="$3"
            msg="$4"
            content="$(base64 -w0 "$src")"
            sha="$(gh api "repos/ThanhNguyxnOrg/$repo/contents/$path" --jq .sha 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              gh api --method PUT "repos/ThanhNguyxnOrg/$repo/contents/$path" \
                -f message="$msg" -f content="$content" -f sha="$sha" -f branch=main >/dev/null
            else
              gh api --method PUT "repos/ThanhNguyxnOrg/$repo/contents/$path" \
                -f message="$msg" -f content="$content" -f branch=main >/dev/null
            fi
          }
          update_file homebrew-tap Formula/gswitch.rb dist/gswitch.rb "chore: gswitch v$version"
          update_file homebrew-tap bucket/gswitch.json dist/gswitch.json "chore: gswitch v$version"
