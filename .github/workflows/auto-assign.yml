name: Auto-assign human-only

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    if: github.event.sender.type != 'Bot' && !endsWith(github.actor, '[bot]')
    # The pinned reusable workflow creates a thanhnguyxnagent GitHub App token
    # from BOT_APP_ID / BOT_PRIVATE_KEY. It does not declare workflow_call
    # secrets, so inherit is required for the app identity to work. Long-term
    # hardening: update the org reusable workflow to declare only those two
    # secrets and pass them explicitly instead of inheriting all secrets.
    uses: ThanhNguyxnOrg/.github/.github/workflows/reusable-auto-assign.yml@2e3f9e8eaf6eb2aae8424c8d63abe1b8ccce8d88
    secrets: inherit
